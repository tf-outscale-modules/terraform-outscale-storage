# OpenSpec project configuration for a Terraform module repository
# (template from the profiles repository, profile terraform-module).
# `context` is injected into every planning artifact; keep it to what is
# specific to THIS module. Engineering standards are not repeated here: they
# are fetched on demand from the referenced stores (quality, repository, terraform) (see the index that
# `openspec instructions` prints). `mise run spec-setup` registers the stores.
schema: spec-driven

# `ref` pins each store to a released tag (openspec-consumption); the setup
# script clones at that tag and reports a registered checkout on another commit.
references:
  - id: quality
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/quality.git
    ref: v1.2.6
  - id: repository
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/repository.git
    ref: v4.1.0
  - id: terraform
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/terraform.git
    ref: v1.2.6

context: |
  Quality mandate: every artifact applies the non-negotiables of AGENTS.md
  (simple, efficient, secure, production-level) and cites the quality-store
  specs that decided something.

  Project: OpenTofu/Terraform module that manages Outscale cloud storage:
  BSU volumes and their attachments to VMs, snapshots, images (OMI) and the
  export tasks of snapshots and images to an OOS bucket. Every family is
  behind an enable_* flag, off by default. Published at
  gitlab.com/leminnov/terraform/modules/outscale-storage; consumers pin a git
  tag (?ref=vX.Y.Z). Apache-2.0.

  Stack: HCL only. required_version >= 1.5. Providers pinned with ~> in
  versions.tf: outscale/outscale ~> 1.8. Every tool is pinned in mise.toml.

  Layout: main.tf holds every resource, one section per family (images,
  image export tasks, volumes, volume links, snapshots, snapshot export
  tasks); variables.tf the inputs (feature flags, common, then one section
  per family) with their validation blocks; outputs.tf the outputs; locals.tf
  the common tags; there is no checks.tf or data.tf. The unit tests are in
  tests/main.tftest.hcl (plan only, with a provider block carrying dummy
  credentials; no mock_provider, no integration fixture); the example is
  examples/complete. CI exists for GitLab (.gitlab/) and GitHub (.github/).

  Module-specific conventions (the generic ones are standards in the
  quality, repository and terraform stores, fetched on demand): resources use
  for_each over map(object) inputs gated by an enable_* flag; cross references
  use a *_key (resource of the same call) or a *_id (external resource);
  every resource carries the common tags Project, Environment and ManagedBy;
  the OSU API key of the export tasks is a sensitive object input; README
  tables are generated by terraform-docs; CHANGELOG.md is generated by
  git-cliff from commit subjects (mise run changelog, .cliff.toml; plain
  subjects are kept, merge and changelog commits skipped), so a commit subject
  reads as its CHANGELOG line; releases follow semver.

  Commands: tofu fmt -recursive; tofu init -backend=false && tofu validate;
  tflint --recursive; tofu test; pre-commit run -a; mise run changelog;
  mise run spec-validate; mise run spec-setup.

  Standards: fetch the referenced-store specs listed in these instructions
  whose id matches the area touched, and cite the ones applied.

rules:
  proposal:
    - Classify the change as semver major/minor/patch per terraform-versioning and list every input or output whose type, default or meaning changes
    - State what lands in state; a new secret-bearing input must follow terraform-security (write-only argument plus *_wo_version) or justify why it cannot
  specs:
    - Write requirements against the module's observable contract (input shape, validation errors, resources produced, outputs, check warnings, empty second plan), not against provider internals
    - Give every validation block and every check block a scenario with the rejected or warned input
  design:
    - Name the resources and arguments used and the provider version that introduced them
    - Explain how the change avoids a perpetual diff and how existing state migrates (moved blocks, in-place update or forced replacement)
    - Keep provider {} and backend {} out of the module and never shell out to a CLI
  tasks:
    - Include unit tests in tests/main.tftest.hcl (plan only, no Outscale account needed), and examples/complete plus any example the change affects
    - Include tofu fmt -recursive, tofu validate, tflint --recursive, tofu test and pre-commit run -a (terraform-docs README regeneration)
    - Plan a commit subject that reads as the CHANGELOG.md line (git-cliff generates the file; mention upgrade notes for anything breaking in the commit body and the README), and README updates when the compatibility matrix or the security notes change
    - Reuse the existing capability directories under openspec/specs (module-contract, volumes, snapshots, images) before creating a new one

operations:
  apply:
    guidance:
      - Apply the quality store (simplicity, efficiency, security, production-readiness) to every task; fetch terraform-code-style, terraform-variables and terraform-outputs from the terraform store before editing HCL; flag any deviation with a DEVIATION(<spec-id>) comment
      - Run tofu fmt -recursive, tofu validate and tofu test after each task group and do not mark a task done while they fail
      - There is no integration suite; never run tofu apply against a real Outscale account unless the user asked
      - Report test and scanner output as-is, including failures
  archive:
    guidance:
      - Confirm the terraform-docs README block was updated and that the commit subject reads as the CHANGELOG line (CHANGELOG.md is regenerated with `mise run changelog` at release) before archiving
      - Summarize which main specs changed and any requirement that was removed
